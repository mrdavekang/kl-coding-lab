<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title"><title id="title">Try 6 trace the best so far</title><rect width="1600" height="700" fill="#fff"/><g font-family="Arial,sans-serif"><text x="50" y="80" font-size="43" font-weight="700" text-anchor="start" fill="#17212b">Try 6 trace the best so far</text><text x="50" y="140" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">Read the candidate totals from left to right. Write the smallest total seen so far.</text><text x="50" y="245" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">Cut</text><text x="50" y="360" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">Total</text><text x="50" y="500" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">Best so far</text><text x="320" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">0</text><rect x="253" y="300" width="134" height="95" fill="#edf3f6"/><text x="320" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">29</text><line x1="265" y1="520" x2="375" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="478" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">1</text><rect x="411" y="300" width="134" height="95" fill="#edf3f6"/><text x="478" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">29</text><line x1="423" y1="520" x2="533" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="636" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">2</text><rect x="569" y="300" width="134" height="95" fill="#edf3f6"/><text x="636" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">24</text><line x1="581" y1="520" x2="691" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="794" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">3</text><rect x="727" y="300" width="134" height="95" fill="#edf3f6"/><text x="794" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">33</text><line x1="739" y1="520" x2="849" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="952" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">4</text><rect x="885" y="300" width="134" height="95" fill="#edf3f6"/><text x="952" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">27</text><line x1="897" y1="520" x2="1007" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="1110" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">5</text><rect x="1043" y="300" width="134" height="95" fill="#edf3f6"/><text x="1110" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">34</text><line x1="1055" y1="520" x2="1165" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="1268" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">6</text><rect x="1201" y="300" width="134" height="95" fill="#edf3f6"/><text x="1268" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">37</text><line x1="1213" y1="520" x2="1323" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="1426" y="245" font-size="35" font-weight="700" text-anchor="middle" fill="#17212b">7</text><rect x="1359" y="300" width="134" height="95" fill="#edf3f6"/><text x="1426" y="360" font-size="38" font-weight="700" text-anchor="middle" fill="#17212b">36</text><line x1="1371" y1="520" x2="1481" y2="520" stroke="#91a7b4" stroke-width="3"/><text x="50" y="635" font-size="33" font-weight="400" text-anchor="start" fill="#17212b">Use the first real total. Keep the best when a later total is larger or equal.</text></g></svg>