<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title"><title id="title">Try 3 compare complete plans</title><rect width="1600" height="700" fill="#fff"/><g font-family="Arial,sans-serif"><text x="50" y="80" font-size="43" font-weight="700" text-anchor="start" fill="#17212b">Try 3 compare complete plans</text><text x="50" y="140" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">Alice starts at 0. Bob starts at 10. The cities are −5 and 4.</text><text x="50" y="210" font-size="35" font-weight="700" text-anchor="start" fill="#17212b">Plan A Alice visits both cities</text><line x1="560" y1="270" x2="880" y2="270" stroke="#2b5f93" stroke-width="4"/><polyline points="865,261 880,270 865,279" fill="none" stroke="#2b5f93" stroke-width="4"/><text x="560" y="245" font-size="32" font-weight="400" text-anchor="start" fill="#17212b">0</text><text x="880" y="245" font-size="32" font-weight="400" text-anchor="start" fill="#17212b">4</text><line x1="880" y1="350" x2="160" y2="350" stroke="#2b5f93" stroke-width="4"/><polyline points="175,341 160,350 175,359" fill="none" stroke="#2b5f93" stroke-width="4"/><text x="160" y="330" font-size="32" font-weight="400" text-anchor="start" fill="#17212b">−5</text><text x="880" y="330" font-size="32" font-weight="400" text-anchor="start" fill="#17212b">4</text><text x="1100" y="280" font-size="31" font-weight="400" text-anchor="start" fill="#9a6200">Bob stays at 10</text><text x="1100" y="350" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">Total = ?</text><line x1="50" y1="405" x2="1550" y2="405" stroke="#cad1d8" stroke-width="2"/><text x="50" y="465" font-size="35" font-weight="700" text-anchor="start" fill="#17212b">Plan B share the cities</text><line x1="560" y1="530" x2="160" y2="530" stroke="#2b5f93" stroke-width="4"/><polyline points="175,521 160,530 175,539" fill="none" stroke="#2b5f93" stroke-width="4"/><text x="160" y="580" font-size="31" font-weight="400" text-anchor="middle" fill="#2b5f93">Alice to −5</text><text x="560" y="505" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">0</text><line x1="1360" y1="530" x2="880" y2="530" stroke="#9a6200" stroke-width="4"/><polyline points="895,521 880,530 895,539" fill="none" stroke="#9a6200" stroke-width="4"/><text x="1360" y="505" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">10</text><text x="880" y="580" font-size="31" font-weight="400" text-anchor="middle" fill="#9a6200">Bob to 4</text><text x="1100" y="645" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">Total = ?</text></g></svg>