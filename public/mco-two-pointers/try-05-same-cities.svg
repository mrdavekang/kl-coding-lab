<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" role="img" aria-labelledby="title"><title id="title">Try 5 keep the cities and change the start</title><rect width="1600" height="730" fill="#fff"/><g font-family="Arial,sans-serif"><text x="50" y="80" font-size="43" font-weight="700" text-anchor="start" fill="#17212b">Try 5 keep the cities and change the start</text><text x="50" y="140" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">Blue marks the start. Gold marks the assigned cities. No return home is required.</text><text x="50" y="205" font-size="35" font-weight="700" text-anchor="start" fill="#17212b">First start at 5</text><line x1="230" y1="285" x2="1370" y2="285" stroke="#17212b" stroke-width="3"/><line x1="230" y1="278" x2="230" y2="292" stroke="#17212b" stroke-width="3"/><text x="230" y="333" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">-3</text><line x1="515" y1="278" x2="515" y2="292" stroke="#17212b" stroke-width="3"/><text x="515" y="333" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">0</text><line x1="610" y1="278" x2="610" y2="292" stroke="#17212b" stroke-width="3"/><text x="610" y="333" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">1</text><line x1="990" y1="278" x2="990" y2="292" stroke="#17212b" stroke-width="3"/><text x="990" y="333" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">5</text><line x1="1370" y1="278" x2="1370" y2="292" stroke="#17212b" stroke-width="3"/><text x="1370" y="333" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">9</text><circle cx="990" cy="285" r="12" fill="#2b5f93"/><rect x="601" y="276" width="18" height="18" fill="#9a6200"/><rect x="1361" y="276" width="18" height="18" fill="#9a6200"/><text x="50" y="450" font-size="35" font-weight="700" text-anchor="start" fill="#17212b">Then start at −3</text><line x1="230" y1="530" x2="1370" y2="530" stroke="#17212b" stroke-width="3"/><line x1="230" y1="523" x2="230" y2="537" stroke="#17212b" stroke-width="3"/><text x="230" y="578" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">-3</text><line x1="515" y1="523" x2="515" y2="537" stroke="#17212b" stroke-width="3"/><text x="515" y="578" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">0</text><line x1="610" y1="523" x2="610" y2="537" stroke="#17212b" stroke-width="3"/><text x="610" y="578" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">1</text><line x1="990" y1="523" x2="990" y2="537" stroke="#17212b" stroke-width="3"/><text x="990" y="578" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">5</text><line x1="1370" y1="523" x2="1370" y2="537" stroke="#17212b" stroke-width="3"/><text x="1370" y="578" font-size="31" font-weight="400" text-anchor="middle" fill="#17212b">9</text><circle cx="230" cy="530" r="12" fill="#2b5f93"/><rect x="601" y="521" width="18" height="18" fill="#9a6200"/><rect x="1361" y="521" width="18" height="18" fill="#9a6200"/><text x="50" y="680" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">Cities stay at 1 and 9. Compare left end first with right end first for each start.</text></g></svg>