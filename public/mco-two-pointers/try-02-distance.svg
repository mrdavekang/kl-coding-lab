<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title"><title id="title">Try 2 a place and a distance</title><rect width="1600" height="700" fill="#fff"/><g font-family="Arial,sans-serif"><text x="50" y="80" font-size="43" font-weight="700" text-anchor="start" fill="#17212b">Try 2 a place and a distance</text><text x="50" y="140" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">Use the same gap in both directions. Distance is never negative.</text><text x="50" y="205" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">From −3 to 5</text><line x1="180" y1="252" x2="180" y2="268" stroke="#17212b" stroke-width="3"/><text x="180" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">-3</text><line x1="335" y1="252" x2="335" y2="268" stroke="#17212b" stroke-width="3"/><text x="335" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">-2</text><line x1="490" y1="252" x2="490" y2="268" stroke="#17212b" stroke-width="3"/><text x="490" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">-1</text><line x1="645" y1="252" x2="645" y2="268" stroke="#17212b" stroke-width="3"/><text x="645" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">0</text><line x1="800" y1="252" x2="800" y2="268" stroke="#17212b" stroke-width="3"/><text x="800" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">1</text><line x1="955" y1="252" x2="955" y2="268" stroke="#17212b" stroke-width="3"/><text x="955" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">2</text><line x1="1110" y1="252" x2="1110" y2="268" stroke="#17212b" stroke-width="3"/><text x="1110" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">3</text><line x1="1265" y1="252" x2="1265" y2="268" stroke="#17212b" stroke-width="3"/><text x="1265" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">4</text><line x1="1420" y1="252" x2="1420" y2="268" stroke="#17212b" stroke-width="3"/><text x="1420" y="308" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">5</text><line x1="180" y1="260" x2="1420" y2="260" stroke="#2b5f93" stroke-width="4"/><polyline points="1405,251 1420,260 1405,269" fill="none" stroke="#2b5f93" stroke-width="4"/><text x="50" y="395" font-size="34" font-weight="700" text-anchor="start" fill="#17212b">From 5 to −3</text><line x1="180" y1="442" x2="180" y2="458" stroke="#17212b" stroke-width="3"/><text x="180" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">-3</text><line x1="335" y1="442" x2="335" y2="458" stroke="#17212b" stroke-width="3"/><text x="335" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">-2</text><line x1="490" y1="442" x2="490" y2="458" stroke="#17212b" stroke-width="3"/><text x="490" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">-1</text><line x1="645" y1="442" x2="645" y2="458" stroke="#17212b" stroke-width="3"/><text x="645" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">0</text><line x1="800" y1="442" x2="800" y2="458" stroke="#17212b" stroke-width="3"/><text x="800" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">1</text><line x1="955" y1="442" x2="955" y2="458" stroke="#17212b" stroke-width="3"/><text x="955" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">2</text><line x1="1110" y1="442" x2="1110" y2="458" stroke="#17212b" stroke-width="3"/><text x="1110" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">3</text><line x1="1265" y1="442" x2="1265" y2="458" stroke="#17212b" stroke-width="3"/><text x="1265" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">4</text><line x1="1420" y1="442" x2="1420" y2="458" stroke="#17212b" stroke-width="3"/><text x="1420" y="498" font-size="30" font-weight="400" text-anchor="middle" fill="#17212b">5</text><line x1="1420" y1="450" x2="180" y2="450" stroke="#2b5f93" stroke-width="4"/><polyline points="195,441 180,450 195,459" fill="none" stroke="#2b5f93" stroke-width="4"/><text x="50" y="625" font-size="30" font-weight="400" text-anchor="start" fill="#17212b">From 2 to 2: the start and destination are the same place. How much movement is needed?</text></g></svg>