<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="730" viewBox="0 0 1600 730" role="img" aria-labelledby="title"><title id="title">Try 1 name the input and output</title><rect width="1600" height="730" fill="#fff"/><g font-family="Arial,sans-serif"><text x="50" y="80" font-size="43" font-weight="700" text-anchor="start" fill="#17212b">Try 1 name the input and output</text><text x="50" y="140" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">Alice starts at 4. Bob starts at 6. The only city is at 1.</text><line x1="120" y1="280" x2="1480" y2="280" stroke="#17212b" stroke-width="3"/><line x1="120.0" y1="270" x2="120.0" y2="290" stroke="#17212b" stroke-width="3"/><text x="120.0" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">0</text><line x1="314.2857142857143" y1="270" x2="314.2857142857143" y2="290" stroke="#17212b" stroke-width="3"/><text x="314.2857142857143" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">1</text><line x1="508.57142857142856" y1="270" x2="508.57142857142856" y2="290" stroke="#17212b" stroke-width="3"/><text x="508.57142857142856" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">2</text><line x1="702.8571428571429" y1="270" x2="702.8571428571429" y2="290" stroke="#17212b" stroke-width="3"/><text x="702.8571428571429" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">3</text><line x1="897.1428571428571" y1="270" x2="897.1428571428571" y2="290" stroke="#17212b" stroke-width="3"/><text x="897.1428571428571" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">4</text><line x1="1091.4285714285716" y1="270" x2="1091.4285714285716" y2="290" stroke="#17212b" stroke-width="3"/><text x="1091.4285714285716" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">5</text><line x1="1285.7142857142858" y1="270" x2="1285.7142857142858" y2="290" stroke="#17212b" stroke-width="3"/><text x="1285.7142857142858" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">6</text><line x1="1480.0" y1="270" x2="1480.0" y2="290" stroke="#17212b" stroke-width="3"/><text x="1480.0" y="340" font-size="33" font-weight="400" text-anchor="middle" fill="#17212b">7</text><line x1="314.2857142857143" y1="365" x2="314.2857142857143" y2="415" stroke="#17212b" stroke-width="2"/><circle cx="314.2857142857143" cy="425" r="10" fill="#17212b"/><text x="314.2857142857143" y="480" font-size="32" font-weight="700" text-anchor="middle" fill="#17212b">City 1</text><line x1="897.1428571428571" y1="365" x2="897.1428571428571" y2="495" stroke="#2b5f93" stroke-width="2"/><circle cx="897.1428571428571" cy="505" r="10" fill="#2b5f93"/><text x="897.1428571428571" y="560" font-size="32" font-weight="700" text-anchor="middle" fill="#2b5f93">Alice starts 4</text><line x1="1285.7142857142858" y1="365" x2="1285.7142857142858" y2="575" stroke="#9a6200" stroke-width="2"/><circle cx="1285.7142857142858" cy="585" r="10" fill="#9a6200"/><text x="1285.7142857142858" y="640" font-size="32" font-weight="700" text-anchor="middle" fill="#9a6200">Bob starts 6</text><text x="50" y="675" font-size="30" font-weight="400" text-anchor="start" fill="#17212b">One person can visit the city while the other stays still. Count the units on the line.</text></g></svg>