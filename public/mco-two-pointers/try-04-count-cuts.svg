<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title"><title id="title">Try 4 count the cuts</title><rect width="1600" height="700" fill="#fff"/><g font-family="Arial,sans-serif"><text x="50" y="80" font-size="43" font-weight="700" text-anchor="start" fill="#17212b">Try 4 count the cuts</text><text x="50" y="140" font-size="31" font-weight="400" text-anchor="start" fill="#17212b">Place a divider before, between or after these three sorted city cards.</text><rect x="280" y="280" width="330" height="140" fill="#edf3f6"/><text x="445" y="370" font-size="55" font-weight="700" text-anchor="middle" fill="#17212b">-4</text><rect x="640" y="280" width="330" height="140" fill="#edf3f6"/><text x="805" y="370" font-size="55" font-weight="700" text-anchor="middle" fill="#17212b">3</text><rect x="1000" y="280" width="330" height="140" fill="#edf3f6"/><text x="1165" y="370" font-size="55" font-weight="700" text-anchor="middle" fill="#17212b">12</text><line x1="260" y1="245" x2="260" y2="455" stroke="#17212b" stroke-width="5"/><line x1="620" y1="245" x2="620" y2="455" stroke="#17212b" stroke-width="5"/><line x1="980" y1="245" x2="980" y2="455" stroke="#17212b" stroke-width="5"/><line x1="1340" y1="245" x2="1340" y2="455" stroke="#17212b" stroke-width="5"/><text x="50" y="540" font-size="34" font-weight="400" text-anchor="start" fill="#17212b">The outside gaps count too. A person may receive no city cards.</text><text x="50" y="615" font-size="32" font-weight="400" text-anchor="start" fill="#17212b">At cut 2, Alice receives the first two cards. Bob receives the remaining cards.</text></g></svg>