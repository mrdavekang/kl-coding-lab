<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370"><title>One character per turn</title><desc>Print bit, the current character.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="370" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">One character per turn</text><text x="24" y="82" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">bits = &quot;01010&quot;</text><rect x="50" y="119" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="76.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="102" y="119" width="52" height="48" fill="#e5eff9" stroke="#9aadb8"/><text x="128.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="154" y="119" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="180.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="206" y="119" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="232.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="258" y="119" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="284.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="24" y="200" width="312" height="83" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="225" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">CURRENT CHARACTER</text><text x="40" y="264" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">bit = &quot;1&quot;</text><text x="24" y="319" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">Output so far: 0, then 1</text><text x="24" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Print bit, the current character.</text></svg>