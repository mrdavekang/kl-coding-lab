<svg xmlns="http://www.w3.org/2000/svg" width="360" height="375" viewBox="0 0 360 375"><title>Index chooses a character</title><desc>2 is the index; 0 is the character.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="375" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Index chooses a character</text><text x="24" y="82" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">bits = &quot;10010&quot;</text><text x="24" y="112" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Python indices</text><text x="76.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">0</text><rect x="50" y="151" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="76.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><text x="128.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">1</text><rect x="102" y="151" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="128.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><text x="180.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">2</text><rect x="154" y="151" width="52" height="48" fill="#e5eff9" stroke="#9aadb8"/><text x="180.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><text x="232.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">3</text><rect x="206" y="151" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="232.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><text x="284.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">4</text><rect x="258" y="151" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="284.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><text x="24" y="240" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">index = 2</text><text x="24" y="281" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">bits[index] → bits[2]</text><text x="24" y="324" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">Output: 0</text><text x="24" y="355" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">2 is the index; 0 is the character.</text></svg>