<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>One from each list</title><desc>Each pair fixes two wrong places.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">One from each list</text><rect x="65" y="85" width="290" height="120" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="81" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">leftWrong</text><text x="81" y="186" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[2]</text><rect x="545" y="85" width="290" height="120" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="561" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">rightWrong</text><text x="561" y="186" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[5]</text><path d="M380 146L520 146" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><text x="450" y="246" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">Swap 2 5</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Each pair fixes two wrong places.</text></svg>