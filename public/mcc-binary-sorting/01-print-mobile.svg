<svg xmlns="http://www.w3.org/2000/svg" width="360" height="345" viewBox="0 0 360 345"><title>Code to Shell</title><desc>Quotes stay in the code.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="345" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Code to Shell</text><rect x="24" y="70" width="312" height="90" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">EDITOR</text><text x="40" y="141" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">print(&quot;0&quot;)</text><path d="M180 170L180 198" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="24" y="210" width="312" height="90" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">SHELL</text><text x="40" y="281" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">0</text><text x="24" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Quotes stay in the code.</text></svg>