<svg xmlns="http://www.w3.org/2000/svg" width="360" height="340" viewBox="0 0 360 340"><title>One from each list</title><desc>Each pair fixes two wrong places.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="340" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">One from each list</text><rect x="24" y="88" width="148" height="105" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="113" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">leftWrong</text><text x="40" y="174" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[2]</text><rect x="188" y="88" width="148" height="105" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="204" y="113" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">rightWrong</text><text x="204" y="174" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[5]</text><path d="M98 211L180 247" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><path d="M262 211L180 247" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><text x="180" y="287" font-family="Consolas, monospace" font-size="25" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">Swap 2 5</text><text x="24" y="320" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Each pair fixes two wrong places.</text></svg>