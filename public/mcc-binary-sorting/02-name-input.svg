<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285"><title>Read → Remember → Print</title><desc>Try Maya next. Keep the same code.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="285" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Read → Remember → Print</text><rect x="30" y="100" width="240" height="120" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="46" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">TYPE AND PRESS ENTER</text><text x="46" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">Alex</text><path d="M282 160L315 160" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="330" y="100" width="240" height="120" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="346" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">name = input()</text><text x="346" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">&quot;Alex&quot;</text><path d="M582 160L615 160" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="630" y="100" width="240" height="120" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="646" y="125" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">print(name)</text><text x="646" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">Alex</text><text x="34" y="265" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Try Maya next. Keep the same code.</text></svg>