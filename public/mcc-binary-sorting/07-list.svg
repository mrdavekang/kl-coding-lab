<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>Keep positions in a list</title><desc>These are question positions.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Keep positions in a list</text><rect x="35" y="90" width="230" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="51" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">START EMPTY</text><text x="51" y="196" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[]</text><path d="M280 150L310 150" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="330" y="90" width="230" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="346" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">APPEND POSITION 2</text><text x="346" y="196" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[2]</text><path d="M575 150L605 150" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="625" y="90" width="240" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="641" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">APPEND POSITION 4</text><text x="641" y="196" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[2, 4]</text><text x="450" y="254" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">len(positions) = 2</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">These are question positions.</text></svg>