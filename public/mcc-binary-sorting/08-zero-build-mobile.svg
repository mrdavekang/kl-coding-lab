<svg xmlns="http://www.w3.org/2000/svg" width="360" height="490" viewBox="0 0 360 490"><title>Input → Count → Inspect</title><desc>Count first. Inspect afterwards.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="490" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Input → Count → Inspect</text><rect x="24" y="75" width="312" height="100" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">INPUT</text><text x="40" y="156" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="40" y="128" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">n = 5</text><text x="40" y="158" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">bits = &quot;01010&quot;</text><path d="M180 180L180 199" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="24" y="210" width="312" height="90" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="235" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">COUNT THE WHOLE STRING</text><text x="40" y="281" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">zeroCount = 3</text><path d="M180 305L180 324" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="24" y="335" width="312" height="110" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="360" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">INSPECT FIRST 3 PLACES</text><text x="40" y="426" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="40" y="389" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">Positions: 1, 2, 3</text><text x="40" y="425" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">Output: 2</text><text x="24" y="470" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Count first. Inspect afterwards.</text></svg>