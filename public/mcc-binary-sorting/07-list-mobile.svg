<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420"><title>Keep positions in a list</title><desc>These are question positions.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="420" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Keep positions in a list</text><rect x="24" y="72" width="312" height="75" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="97" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">START EMPTY</text><text x="40" y="128" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[]</text><rect x="24" y="167" width="312" height="75" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="192" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">APPEND POSITION 2</text><text x="40" y="223" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[2]</text><rect x="24" y="262" width="312" height="75" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="287" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">APPEND POSITION 4</text><text x="40" y="318" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">[2, 4]</text><text x="180" y="376" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">len(positions) = 2</text><text x="24" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#