<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>One character per turn</title><desc>Print bit, the current character.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">One character per turn</text><text x="65" y="82" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">bits = &quot;01010&quot;</text><rect x="65" y="119" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="97.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="129" y="119" width="64" height="48" fill="#e5eff9" stroke="#9aadb8"/><text x="161.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="193" y="119" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="225.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="257" y="119" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="289.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="321" y="119" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="353.0" y="152" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="520" y="106" width="325" height="102" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="536" y="131" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">CURRENT CHARACTER</text><text x="536" y="189" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">bit = &quot;1&quot;</text><text x="65" y="240" font-family="Consolas, monospace" font-size="22" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">for bit in bits:</text><text x="345" y="240" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">visits one character each turn</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Print bit, the current character.</text></svg>