<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320"><title>Read two separate lines</title><desc>n is a number. bits stays as text.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="320" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Read two separate lines</text><rect x="24" y="72" width="312" height="85" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="97" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">FIRST LINE: 5</text><text x="40" y="138" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">n = 5</text><rect x="24" y="178" width="312" height="85" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="203" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">SECOND LINE: 01010</text><text x="40" y="244" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">bits = &quot;01010&quot;</text><text x="24" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">n is a number. bits stays as text.</text></svg>