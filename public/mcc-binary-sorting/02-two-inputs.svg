<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>Read two separate lines</title><desc>n is a number. bits stays as text.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Read two separate lines</text><rect x="45" y="95" width="370" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="61" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">FIRST LINE: 5</text><text x="61" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">n = 5</text><rect x="470" y="95" width="385" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="486" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">SECOND LINE: 01010</text><text x="486" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">bits = &quot;01010&quot;</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">n is a number. bits stays as text.</text></svg>