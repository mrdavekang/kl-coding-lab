<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350"><title>Keep the whole input</title><desc>The first zero is kept.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="350" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Keep the whole input</text><rect x="24" y="75" width="312" height="85" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">TYPE IN THE SHELL</text><text x="40" y="141" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">01010</text><path d="M180 172L180 204" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="24" y="217" width="312" height="85" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="242" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">REMEMBER AS bits</text><text x="40" y="283" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">&quot;01010&quot;</text><text x="24" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">The first zero is kept.</text></svg>