<svg xmlns="http://www.w3.org/2000/svg" width="900" height="285" viewBox="0 0 900 285"><title>Start before the loop</title><desc>No characters visited: no zeros counted.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="285" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Start before the loop</text><rect x="45" y="95" width="390" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="61" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">BEFORE ANY VISIT</text><text x="61" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">zeroCount = 0</text><text x="510" y="100" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">Then visit each character</text><rect x="510" y="140" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="542.0" y="173" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="574" y="140" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="606.0" y="173" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="638" y="140" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="670.0" y="173" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="702" y="140" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="734.0" y="173" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#1