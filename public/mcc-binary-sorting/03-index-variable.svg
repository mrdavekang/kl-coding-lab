<svg xmlns="http://www.w3.org/2000/svg" width="900" height="325" viewBox="0 0 900 325"><title>Index chooses a character</title><desc>2 is the index; 0 is the character.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="325" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Index chooses a character</text><text x="65" y="82" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">bits = &quot;10010&quot;</text><text x="65" y="112" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Python indices</text><text x="172.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">0</text><rect x="140" y="151" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="172.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><text x="236.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">1</text><rect x="204" y="151" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="236.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><text x="300.0" y="138" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#536674" text-anchor="middle" xml:space="preserve">2</text><rect x="268" y="151" width="64" height="48" fill="#e5eff9" stroke="#9aadb8"/><text x="300.0" y="184" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anc