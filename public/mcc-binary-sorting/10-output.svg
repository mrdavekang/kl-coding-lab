<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>Count first, then pairs</title><desc>Different minimum plans can be valid.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Count first, then pairs</text><rect x="65" y="77" width="360" height="130" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="81" y="102" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">ONE VALID OUTPUT</text><text x="81" y="188" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="90" y="133" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">1</text><text x="485" y="133" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">swap count</text><text x="90" y="176" font-family="Consolas, monospace" font-size="26" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">2 5</text><text x="485" y="176" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">positions</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Different minimum plans can be valid.</text></svg>