<svg xmlns="http://www.w3.org/2000/svg" width="360" height="320" viewBox="0 0 360 320"><title>Choose only zeros</title><desc>The indented line runs for a match.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="320" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Choose only zeros</text><text x="24" y="91" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">if bit == &quot;0&quot;:</text><text x="24" y="123" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">    print(bit)</text><text x="35" y="190" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">&quot;0&quot;</text><path d="M92 182L138 182" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><text x="161" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">match: print 0</text><text x="35" y="257" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">&quot;1&quot;</text><path d="M92 249L138 249" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><text x="161" y="257" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">no match: skip</text><text x="24" y="300" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">The indented line runs for a match.</text></svg>