<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>Keep the whole input</title><desc>The first zero is kept.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Keep the whole input</text><rect x="45" y="95" width="350" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="61" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">TYPE IN THE SHELL</text><text x="61" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">01010</text><path d="M420 155L480 155" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="510" y="95" width="345" height="125" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="526" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">bits = input()</text><text x="526" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">&quot;01010&quot;</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">The first zero is kept.</text></svg>