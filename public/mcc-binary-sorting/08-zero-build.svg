<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315"><title>Input → Count → Inspect</title><desc>Count first. Inspect afterwards.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="315" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Input → Count → Inspect</text><rect x="35" y="95" width="240" height="165" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="51" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">INPUT</text><text x="51" y="241" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="51" y="159" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">n = 5</text><text x="51" y="203" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">bits = &quot;01010&quot;</text><path d="M286 177L313 177" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="325" y="95" width="250" height="165" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="341" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">COUNT WHOLE STRING</text><text x="341" y="241" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="341" y="165" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">zeroCount = 3</text><text x="341" y="210" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">First loop</text><path d="M586 177L613 177" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="625" y="95" width="240" height="165" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="641" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">INSPECT ZERO PLACES</text><text x="641" y="241" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="641" y="165" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">1, 2, 3</text><text x="641" y="210" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">Output: 2</text><text x="34" y="295" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Count first. Inspect afterwards.</text></svg>