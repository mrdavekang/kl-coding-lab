<svg xmlns="http://www.w3.org/2000/svg" width="360" height="370" viewBox="0 0 360 370"><title>Build the counting block</title><desc>Start before. Print after.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="370" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Build the counting block</text><text x="24" y="88" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">Start once, before the loop</text><text x="18" y="127" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">zeroCount = 0</text><text x="18" y="162" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">for bit in bits:</text><text x="18" y="197" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">    if bit == &quot;0&quot;:</text><text x="18" y="232" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">        zeroCount = zeroCount + 1</text><text x="18" y="267" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">print(zeroCount)</text><text x="24" y="323" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">For 01010, final count: 3.</text><text x="24" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Start before. Print after.</text></svg>