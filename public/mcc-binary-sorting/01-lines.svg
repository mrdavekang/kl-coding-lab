<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>Two print lines</title><desc>Each print starts a new line.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Two print lines</text><rect x="45" y="90" width="360" height="130" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="61" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">EDITOR</text><text x="61" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="61" y="155" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">print(&quot;0&quot;)</text><text x="61" y="199" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">print(&quot;1&quot;)</text><path d="M430 155L480 155" fill="none" stroke="#245a8d" stroke-width="2.5" marker-end="url(#tip)"/><rect x="510" y="90" width="340" height="130" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="526" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">SHELL</text><text x="526" y="201" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve"></text><text x="526" y="155" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">0</text><text x="526" y="199" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">1</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Each print starts a new line.</text></svg>