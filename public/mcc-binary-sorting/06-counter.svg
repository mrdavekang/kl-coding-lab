<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300"><title>Add one for a zero</title><desc>A one leaves the count unchanged.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="300" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Add one for a zero</text><text x="65" y="84" font-family="Consolas, monospace" font-size="20" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">Start: zeroCount = 0</text><rect x="140" y="123" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="172.0" y="156" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="204" y="123" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="236.0" y="156" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="268" y="123" width="64" height="48" fill="#e5eff9" stroke="#9aadb8"/><text x="300.0" y="156" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="332" y="123" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="364.0" y="156" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="396" y="123" width="64" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="428.0" y="156" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><text x="65" y="210" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Count after each visit</text><text x="172.0" y="247" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">1</text><text x="236.0" y="247" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">1</text><text x="300.0" y="247" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">2</text><text x="364.0" y="247" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">2</text><text x="428.0" y="247" font-family="Consolas, monospace" font-size="24" font-weight="400" fill="#245a8d" text-anchor="middle" xml:space="preserve">3</text><text x="34" y="280" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">A one leaves the count unchanged.</text></svg>