<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330"><title>Start before the loop</title><desc>No characters visited: no zeros counted.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="360" height="330" fill="#fff"/><text x="24" y="38" font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Start before the loop</text><rect x="24" y="75" width="312" height="92" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="40" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">BEFORE ANY VISIT</text><text x="40" y="148" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">zeroCount = 0</text><text x="24" y="207" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">Then visit the characters:</text><rect x="50" y="232" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="76.0" y="265" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="102" y="232" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="128.0" y="265" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="154" y="232" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="180.0" y="265" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><rect x="206" y="232" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="232.0" y="265" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">1</text><rect x="258" y="232" width="52" height="48" fill="#f8fafb" stroke="#9aadb8"/><text x="284.0" y="265" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#173949" text-anchor="middle" xml:space="preserve">0</text><text x="24" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">No characters visited: no zeros counted.</text></svg>