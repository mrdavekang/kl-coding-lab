<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315"><title>Build the counting block</title><desc>Start before. Print after.</desc><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#245a8d"/></marker></defs><rect width="900" height="315" fill="#fff"/><text x="34" y="42" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#173949" text-anchor="start" xml:space="preserve">Build the counting block</text><text x="45" y="99" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">zeroCount = 0</text><text x="45" y="136" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">for bit in bits:</text><text x="45" y="173" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">    if bit == &quot;0&quot;:</text><text x="45" y="210" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#173949" text-anchor="start" xml:space="preserve">        zeroCount = zeroCount + 1</text><text x="45" y="247" font-family="Consolas, monospace" font-size="21" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">print(zeroCount)</text><rect x="530" y="95" width="320" height="105" rx="7" fill="#f0f5f8" stroke="#ccdbe3"/><text x="546" y="120" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">INPUT STRING</text><text x="546" y="181" font-family="Consolas, monospace" font-size="27" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">01010</text><text x="545" y="247" font-family="Consolas, monospace" font-size="23" font-weight="400" fill="#245a8d" text-anchor="start" xml:space="preserve">Finished count: 3</text><text x="34" y="295" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#536674" text-anchor="start" xml:space="preserve">Start before. Print after.</text></svg>