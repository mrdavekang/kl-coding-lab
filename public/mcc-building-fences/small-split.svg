<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Two items on one input line</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Two items on one input line</text><rect x="45" y="110" width="240" height="172" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="65" y="152" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">KEYBOARD INPUT</text><text x="85" y="223" fill="#245b99" font-size="43" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">3 5</text><path d="M305 200h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="390" y="110" width="250" height="172" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="410" y="152" fill="#173c31" font-size="26" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">parts[0]</text><text x="480" y="214" fill="#245b99" font-size="35" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">&quot;3&quot;</text><text x="410" y="257" fill="#173c31" font-size="19" font-weight="400" font-family="Arial, sans-serif">First item: index 0</text><rect x="685" y="110" width="270" height="172" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="705" y="152" fill="#173c31" font-size="26" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">parts[1]</text><text x="775" y="214" fill="#245b99" font-size="35" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">&quot;5&quot;</text><text x="705" y="257" fill="#173c31" font-size="19" font-weight="400" font-family="Arial, sans-serif">Second item: index 1</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">input().split() separates the items. int() converts each text item into a number.</text></svg>