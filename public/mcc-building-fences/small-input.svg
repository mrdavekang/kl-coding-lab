<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Read one whole row</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Read one whole row</text><rect x="45" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="65" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">TYPE IN THE SHELL</text><text x="65" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">.#.</text><text x="65" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">Then press Enter.</text><path d="M319 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="395" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="415" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">REMEMBER IT</text><text x="415" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">row = &quot;.#.&quot;</text><text x="415" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">input() keeps the text.</text><path d="M669 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="745" y="105" width="215" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="763" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">SHOW IT AGAIN</text><text x="763" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">.#.</text><text x="763" y="255" fill="#173c31" font-size="19" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">print(row)</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">You type the input in the Shell. The program is already in the editor.</text></svg>