<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Tell Python what to show</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Tell Python what to show</text><rect x="55" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="75" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">IN THE EDITOR</text><text x="75" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">print(&quot;#&quot;)</text><text x="75" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">Keep the quotes and brackets.</text><path d="M337 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="418" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="438" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">IN THE SHELL</text><text x="438" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">#</text><text x="438" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">This is what Python prints.</text><text x="715" y="165" fill="#173c31" font-size="21" font-weight="700" font-family="Arial, sans-serif">Your tiny change</text><text x="715" y="208" fill="#245b99" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#  →  .</text><text x="715" y="252" fill="#173c31" font-size="19" font-weight="400" font-family="Arial, sans-serif">Change one symbol.</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">A dot is grass. A hash is an existing fence.</text></svg>