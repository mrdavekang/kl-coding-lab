<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Start at zero. Add one for a dot.</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Start at zero. Add one for a dot.</text><rect x="65" y="112" width="240" height="176" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="90" y="153" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">Visit 1</text><text x="112" y="210" fill="#245b99" font-size="45" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><text x="90" y="263" fill="#173c31" font-size="23" font-weight="600" font-family="Arial, sans-serif">Count is now 1</text><rect x="350" y="112" width="240" height="176" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="375" y="153" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">Visit 2</text><text x="397" y="210" fill="#245b99" font-size="45" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><text x="375" y="263" fill="#173c31" font-size="23" font-weight="600" font-family="Arial, sans-serif">Count is now 1</text><rect x="635" y="112" width="240" height="176" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="660" y="153" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">Visit 3</text><text x="682" y="210" fill="#245b99" font-size="45" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><text x="660" y="263" fill="#173c31" font-size="23" font-weight="600" font-family="Arial, sans-serif">Count is now 2</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">For .#. : zero → one → one → two. A hash does not increase the count.</text></svg>