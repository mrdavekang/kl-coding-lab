<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Visit one character at a time</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Visit one character at a time</text><text x="50" y="108" fill="#173c31" font-size="25" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">row = &quot;.#.&quot;</text><rect x="50" y="142" width="155" height="110" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="105" y="215" fill="#245b99" font-size="52" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><text x="50" y="291" fill="#173c31" font-size="21" font-weight="400" font-family="Arial, sans-serif">Turn 1: .</text><rect x="260" y="142" width="155" height="110" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="315" y="215" fill="#245b99" font-size="52" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><text x="260" y="291" fill="#173c31" font-size="21" font-weight="400" font-family="Arial, sans-serif">Turn 2: #</text><rect x="470" y="142" width="155" height="110" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="525" y="215" fill="#245b99" font-size="52" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><text x="470" y="291" fill="#173c31" font-size="21" font-weight="400" font-family="Arial, sans-serif">Turn 3: .</text><text x="730" y="160" fill="#173c31" font-size="22" font-weight="400" font-family="Arial, sans-serif">for visits each one.</text><text x="730" y="210" fill="#173c31" font-size="22" font-weight="400" font-family="Arial, sans-serif">symbol is the</text><text x="730" y="245" fill="#173c31" font-size="22" font-weight="400" font-family="Arial, sans-serif">current character.</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">print(symbol) prints just the current character. It does not print the whole row.</text></svg>