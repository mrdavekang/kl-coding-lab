<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Three turns, even though the names start at zero</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Three turns, even though the names start at zero</text><text x="48" y="113" fill="#245b99" font-size="27" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">for turn in range(3):</text><text x="48" y="161" fill="#245b99" font-size="27" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">    print(&quot;#&quot;)</text><rect x="525" y="105" width="120" height="180" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="545" y="146" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">Turn 0</text><text x="563" y="225" fill="#245b99" font-size="44" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="665" y="105" width="120" height="180" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="685" y="146" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">Turn 1</text><text x="703" y="225" fill="#245b99" font-size="44" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="805" y="105" width="120" height="180" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="825" y="146" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">Turn 2</text><text x="843" y="225" fill="#245b99" font-size="44" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">range(3) gives turn names 0, 1 and 2. That is three turns altogether.</text></svg>