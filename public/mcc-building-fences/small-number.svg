<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Turn keyboard text into a number</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Turn keyboard text into a number</text><rect x="45" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="65" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">input() READS</text><text x="65" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">&quot;6&quot;</text><text x="65" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">Text from the keyboard.</text><path d="M319 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="395" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="415" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">int() CONVERTS</text><text x="415" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">6</text><text x="415" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">A whole number.</text><path d="M669 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="745" y="105" width="215" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="763" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">MULTIPLY BY 2</text><text x="763" y="205" fill="#245b99" font-size="26" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">6 * 2 = 12</text><text x="763" y="255" fill="#173c31" font-size="17" font-weight="400" font-family="Arial, sans-serif">Now print the answer.</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">The reading line is supplied. Change only the print line.</text></svg>