<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Index 2 means the third column</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Index 2 means the third column</text><text x="88.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">0</text><text x="146.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">1</text><text x="204.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">2</text><text x="262.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">3</text><rect x="65" y="130" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="82.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="123" y="130" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="140.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="181" y="130" width="58" height="58" fill="#e4effa" stroke="#647566"/><text x="198.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="239" y="130" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="256.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="65" y="188" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="82.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="123" y="188" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="140.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="181" y="188" width="58" height="58" fill="#e4effa" stroke="#647566"/><text x="198.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="239" y="188" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="256.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="65" y="246" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="82.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="123" y="246" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="140.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="181" y="246" width="58" height="58" fill="#e4effa" stroke="#647566"/><text x="198.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="239" y="246" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="256.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="181" y="130" width="58" height="174" fill="none" stroke="#245b99" stroke-width="4"/><text x="65" y="96" fill="#245b99" font-size="18" font-weight="400" font-family="Arial, sans-serif">COLUMN INDICES</text><path d="M338 211h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><text x="440" y="128" fill="#245b99" font-size="26" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">row[2] in each row</text><rect x="440" y="150" width="74" height="47" rx="10" fill="#e4effa" stroke="#cddbc8"/><text x="465" y="185" fill="#245b99" font-size="34" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="440" y="204" width="74" height="47" rx="10" fill="#e4effa" stroke="#cddbc8"/><text x="465" y="239" fill="#245b99" font-size="34" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="440" y="258" width="74" height="47" rx="10" fill="#e4effa" stroke="#cddbc8"/><text x="465" y="293" fill="#245b99" font-size="34" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><text x="580" y="186" fill="#173c31" font-size="23" font-weight="400" font-family="Arial, sans-serif">The position stays 2.</text><text x="580" y="235" fill="#173c31" font-size="23" font-weight="400" font-family="Arial, sans-serif">The row changes.</text><text x="580" y="284" fill="#173c31" font-size="23" font-weight="400" font-family="Arial, sans-serif">So we travel downwards.</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">Read across to find the same position in each row. Count down, not across.</text></svg>