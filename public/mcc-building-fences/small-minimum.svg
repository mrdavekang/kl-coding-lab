<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Keep the smallest cost seen so far</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Keep the smallest cost seen so far</text><rect x="45" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="65" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">START WITH 4</text><text x="65" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">smallest = 4</text><text x="65" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">Use the first cost.</text><path d="M319 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="395" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="415" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">NEXT COST IS 3</text><text x="415" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">3 &lt; 4</text><text x="415" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">Remember 3 instead.</text><path d="M669 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="745" y="105" width="215" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="763" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">NEXT COST IS 2</text><text x="763" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">2 &lt; 3</text><text x="763" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">Remember 2 instead.</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">Only a lower cost replaces smallest. A larger or equal cost leaves it alone.</text></svg>