<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>append means keep one more item</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">append means keep one more item</text><rect x="45" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="65" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">START EMPTY</text><text x="65" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">[]</text><text x="65" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">costs = []</text><path d="M319 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="395" y="105" width="258" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="415" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">APPEND 4</text><text x="415" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">[4]</text><text x="415" y="255" fill="#173c31" font-size="18" font-weight="400" font-family="Arial, sans-serif">costs.append(4)</text><path d="M669 195h52m-12-10 12 10-12 10" fill="none" stroke="#245b99" stroke-width="3"/><rect x="745" y="105" width="215" height="188" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="763" y="140" fill="#53655b" font-size="20" font-weight="400" font-family="Arial, sans-serif">APPEND 2</text><text x="763" y="205" fill="#245b99" font-size="31" font-weight="600" xml:space="preserve" font-family="Consolas, monospace">[4, 2]</text><text x="763" y="255" fill="#173c31" font-size="17" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">costs.append(2)</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">A list keeps several values in order. Add one cost each turn.</text></svg>