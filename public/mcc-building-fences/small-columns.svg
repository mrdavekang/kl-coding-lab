<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400"><title>Repeat the same counting job for every column</title><rect width="1000" height="400" fill="#fff"/><text x="36" y="55" fill="#173c31" font-size="30" font-weight="700" font-family="Arial, sans-serif">Repeat the same counting job for every column</text><text x="88.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">0</text><text x="146.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">1</text><text x="204.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">2</text><text x="262.0" y="115" fill="#245b99" font-size="20" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">3</text><rect x="65" y="130" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="82.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="123" y="130" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="140.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="181" y="130" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="198.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="239" y="130" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="256.0" y="170.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="65" y="188" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="82.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="123" y="188" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="140.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="181" y="188" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="198.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="239" y="188" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="256.0" y="228.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="65" y="246" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="82.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="123" y="246" width="58" height="58" fill="#fff5df" stroke="#647566"/><text x="140.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">#</text><rect x="181" y="246" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="198.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><rect x="239" y="246" width="58" height="58" fill="#f4f7ef" stroke="#647566"/><text x="256.0" y="286.6" fill="#173c31" font-size="36" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">.</text><text x="420" y="121" fill="#173c31" font-size="25" font-weight="600" font-family="Arial, sans-serif">Use one fresh counter per column.</text><rect x="420" y="160" width="112" height="100" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="435" y="189" fill="#53655b" font-size="17" font-weight="400" font-family="Arial, sans-serif">Index 0</text><text x="460" y="236" fill="#245b99" font-size="35" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">2</text><rect x="550" y="160" width="112" height="100" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="565" y="189" fill="#53655b" font-size="17" font-weight="400" font-family="Arial, sans-serif">Index 1</text><text x="590" y="236" fill="#245b99" font-size="35" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">0</text><rect x="680" y="160" width="112" height="100" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="695" y="189" fill="#53655b" font-size="17" font-weight="400" font-family="Arial, sans-serif">Index 2</text><text x="720" y="236" fill="#245b99" font-size="35" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">3</text><rect x="810" y="160" width="112" height="100" rx="10" fill="#edf5e9" stroke="#cddbc8"/><text x="825" y="189" fill="#53655b" font-size="17" font-weight="400" font-family="Arial, sans-serif">Index 3</text><text x="850" y="236" fill="#245b99" font-size="35" font-weight="400" xml:space="preserve" font-family="Consolas, monospace">2</text><text x="420" y="307" fill="#173c31" font-size="22" font-weight="400" font-family="Arial, sans-serif">m = 4, so range(m) visits 0, 1, 2, 3.</text><text x="36" y="370" fill="#53655b" font-size="19" font-weight="400" font-family="Arial, sans-serif">Set missing = 0 when you start a new column. Print its count after visiting its rows.</text></svg>