<svg xmlns="http://www.w3.org/2000/svg" width="900" height="211" viewBox="0 0 900 211"><title>Keep the next column inside the board</title><desc>The destination must also be unblocked. You cannot block the start.</desc><rect width="900" height="211" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Keep the next column inside the board</text><rect x="32.0" y="60" width="411.0" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">LEFT EXISTS WHEN</text><text x="44.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Y &gt; 1</text><text x="44.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">At column 1 there is no column 0.</text><rect x="457.0" y="60" width="411.0" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="469.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">RIGHT EXISTS WHEN</text><text x="469.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Y &lt; N</text><text x="469.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">At column N there is no column N + 1.</text><text x="32" y="188" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">The destination must also be unblocked. You cannot block the start.</text></svg>