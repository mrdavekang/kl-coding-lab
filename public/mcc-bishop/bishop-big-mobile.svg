<svg xmlns="http://www.w3.org/2000/svg" width="360" height="413" viewBox="0 0 360 413"><title>Large boards, two small calculations</title><desc>Do not draw or visit every column. The calculation uses a fixed number of arithmetic steps.</desc><rect width="360" height="413" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Large boards, two small</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">calculations</text><rect x="19" y="88" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="112" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">THE INPUT CAN SAY</text><text x="31" y="135" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">N = 10^18</text><text x="31" y="158" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Use Python int to keep every digit.</text><rect x="19" y="195" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="219" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FOR EACH CASE</text><text x="31" y="242" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Calculate Y.</text><text x="31" y="265" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Calculate N - Y + 1.</text><text x="31" y="288" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Choose the smaller count.</text><text x="19" y="346" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Do not draw or visit every column.</text><text x="19" y="368" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">The calculation uses a fixed number</text><text x="19" y="390" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">of arithmetic steps.</text></svg>