<svg xmlns="http://www.w3.org/2000/svg" width="360" height="584" viewBox="0 0 360 584"><title>Count squares rather than steps</title><desc>There is one reachable zigzag square in each visited column.</desc><rect width="360" height="584" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Count squares rather than</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">steps</text><text x="53.0" y="125.05" fill="#536874" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">r=2</text><rect x="62.0" y="88" width="65" height="65" fill="#fff" stroke="#93acb9"/><text x="94.5" y="130.25" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">-</text><rect x="127.0" y="88" width="65" height="65" fill="#dceee0" stroke="#93acb9"/><text x="159.5" y="130.25" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">o</text><rect x="192.0" y="88" width="65" height="65" fill="#fff" stroke="#93acb9"/><text x="224.5" y="130.25" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">-</text><rect x="257.0" y="88" width="65" height="65" fill="#205b76" stroke="#93acb9"/><text x="289.5" y="130.25" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">B</text><text x="53.0" y="190.05" fill="#536874" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">r=1</text><rect x="62.0" y="153" width="65" height="65" fill="#dceee0" stroke="#93acb9"/><text x="94.5" y="195.25" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">o</text><rect x="127.0" y="153" width="65" height="65" fill="#fff" stroke="#93acb9"/><text x="159.5" y="195.25" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">-</text><rect x="192.0" y="153" width="65" height="65" fill="#dceee0" stroke="#93acb9"/><text x="224.5" y="195.25" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">o</text><rect x="257.0" y="153" width="65" height="65" fill="#fff" stroke="#93acb9"/><text x="289.5" y="195.25" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">-</text><text x="94.5" y="238" fill="#536874" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">1</text><text x="159.5" y="238" fill="#536874" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">2</text><text x="224.5" y="238" fill="#536874" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">3</text><text x="289.5" y="238" fill="#536874" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">4</text><text x="180.0" y="258" fill="#536874" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">B = start     o = reachable     × = block</text><rect x="19" y="281" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="305" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">LEFT ROUTE FROM (2, 4)</text><text x="31" y="328" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">(2, 4) -&gt; (1, 3)</text><text x="31" y="351" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">-&gt; (2, 2) -&gt; (1, 1)</text><rect x="19" y="388" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="412" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">TWO DIFFERENT COUNTS</text><text x="31" y="435" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">3 moves</text><text x="31" y="458" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">4 reachable squares</text><text x="31" y="481" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Include the starting square.</text><text x="19" y="539" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">There is one reachable zigzag square</text><text x="19" y="561" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">in each visited column.</text></svg>