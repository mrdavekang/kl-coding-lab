<svg xmlns="http://www.w3.org/2000/svg" width="900" height="257" viewBox="0 0 900 257"><title>An answer file contains results</title><desc>Each input case produces one count on its own output line.</desc><rect width="900" height="257" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">An answer file contains results</text><rect x="32.0" y="60" width="269.3333333333333" height="139" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">INPUT: THREE CASES</text><text x="44.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">3</text><text x="44.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">5 2 2</text><text x="44.0" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1 1 1</text><text x="44.0" y="176" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">6 1 3</text><rect x="315.3333333333333" y="60" width="269.3333333333333" height="139" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="327.3333333333333" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ANSWER: THREE LINES</text><text x="327.3333333333333" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">2</text><text x="327.3333333333333" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1</text><text x="327.3333333333333" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">3</text><rect x="598.6666666666666" y="60" width="269.3333333333333" height="139" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="610.6666666666666" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">SAVE THE SAMPLE AS</text><text x="610.6666666666666" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">out_sample_01.txt</text><text x="610.6666666666666" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">No prompts, labels or Python</text><text x="610.6666666666666" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">instructions.</text><text x="32" y="234" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Each input case produces one count on its own output line.</text></svg>