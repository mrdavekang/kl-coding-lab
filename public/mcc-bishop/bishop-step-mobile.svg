<svg xmlns="http://www.w3.org/2000/svg" width="360" height="414" viewBox="0 0 360 414"><title>One diagonal step changes both numbers</title><desc>On a two-row board each move reaches an adjacent diagonal square.</desc><rect width="360" height="414" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">One diagonal step changes</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">both numbers</text><rect x="19" y="88" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="112" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FROM (2, 3), LEFT</text><text x="31" y="135" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New row: 3 - 2 = 1</text><text x="31" y="158" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New column: 3 - 1 = 2</text><text x="31" y="181" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Destination: (1, 2)</text><rect x="19" y="218" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="242" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FROM (2, 3), RIGHT</text><text x="31" y="265" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New row: 3 - 2 = 1</text><text x="31" y="288" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New column: 3 + 1 = 4</text><text x="31" y="311" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Destination: (1, 4)</text><text x="19" y="369" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">On a two-row board each move reaches</text><text x="19" y="391" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">an adjacent diagonal square.</text></svg>