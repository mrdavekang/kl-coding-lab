<svg xmlns="http://www.w3.org/2000/svg" width="360" height="498" viewBox="0 0 360 498"><title>Choose the smaller reachable count</title><desc>Changing X changes the row pattern; these column counts stay the same.</desc><rect width="360" height="498" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Choose the smaller</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">reachable count</text><rect x="19" y="88" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="112" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">CALCULATE</text><text x="31" y="135" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">left = Y</text><text x="31" y="158" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">right = N - Y + 1</text><rect x="19" y="195" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="219" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">CHOOSE</text><text x="31" y="242" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Left smaller or equal: keep left.</text><text x="31" y="265" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Otherwise: keep right.</text><rect x="19" y="302" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="326" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">DISPLAY</text><text x="31" y="349" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">print(answer)</text><text x="31" y="372" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">min(left, right) is another way to</text><text x="31" y="395" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">choose.</text><text x="19" y="453" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Changing X changes the row pattern;</text><text x="19" y="475" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">these column counts stay the same.</text></svg>