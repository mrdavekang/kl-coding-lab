<svg xmlns="http://www.w3.org/2000/svg" width="900" height="234" viewBox="0 0 900 234"><title>Large boards, two small calculations</title><desc>Do not draw or visit every column. The calculation uses a fixed number of arithmetic steps.</desc><rect width="900" height="234" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Large boards, two small calculations</text><rect x="32.0" y="60" width="411.0" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">THE INPUT CAN SAY</text><text x="44.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">N = 10^18</text><text x="44.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Use Python int to keep every digit.</text><rect x="457.0" y="60" width="411.0" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="469.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FOR EACH CASE</text><text x="469.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Calculate Y.</text><text x="469.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Calculate N - Y + 1.</text><text x="469.0" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Choose the smaller count.</text><text x="32" y="211" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Do not draw or visit every column. The calculation uses a fixed number of arithmetic steps.</text></svg>