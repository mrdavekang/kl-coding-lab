<svg xmlns="http://www.w3.org/2000/svg" width="900" height="211" viewBox="0 0 900 211"><title>An instruction becomes output</title><desc>print() displays a result. It does not read a new input.</desc><rect width="900" height="211" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">An instruction becomes output</text><rect x="32.0" y="60" width="411.0" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">EDITOR</text><text x="44.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">print(&quot;BISHOP&quot;)</text><rect x="457.0" y="60" width="411.0" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="469.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">SHELL</text><text x="469.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">BISHOP</text><text x="469.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The quotes stay in the code.</text><text x="32" y="188" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">print() displays a result. It does not read a new input.</text></svg>