<svg xmlns="http://www.w3.org/2000/svg" width="360" height="567" viewBox="0 0 360 567"><title>An answer file contains results</title><desc>Each input case produces one count on its own output line.</desc><rect width="360" height="567" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">An answer file contains</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">results</text><rect x="19" y="88" width="322" height="139" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="112" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">INPUT: THREE CASES</text><text x="31" y="135" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">3</text><text x="31" y="158" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">5 2 2</text><text x="31" y="181" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1 1 1</text><text x="31" y="204" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">6 1 3</text><rect x="19" y="241" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="265" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ANSWER: THREE LINES</text><text x="31" y="288" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">2</text><text x="31" y="311" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1</text><text x="31" y="334" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">3</text><rect x="19" y="371" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="395" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">SAVE THE SAMPLE AS</text><text x="31" y="418" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">out_sample_01.txt</text><text x="31" y="441" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">No prompts, labels or Python</text><text x="31" y="464" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">instructions.</text><text x="19" y="522" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Each input case produces one count</text><text x="19" y="544" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">on its own output line.</text></svg>