<svg xmlns="http://www.w3.org/2000/svg" width="360" height="475" viewBox="0 0 360 475"><title>One count line, then one line per case</title><desc>Read T once. Read a fresh N X Y line inside each loop turn.</desc><rect width="360" height="475" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">One count line, then one</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">line per case</text><rect x="19" y="88" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="112" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FIRST LINE</text><text x="31" y="135" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">T = number of cases</text><text x="31" y="158" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Example: 3</text><rect x="19" y="195" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="219" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">EACH CASE LINE</text><text x="31" y="242" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">N X Y</text><text x="31" y="265" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">columns, row, column</text><rect x="19" y="302" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="326" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">READ ONE CASE</text><text x="31" y="349" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">input().split()</text><text x="31" y="372" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Convert its three items.</text><text x="19" y="430" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Read T once. Read a fresh N X Y line</text><text x="19" y="452" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">inside each loop turn.</text></svg>