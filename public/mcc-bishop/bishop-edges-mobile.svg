<svg xmlns="http://www.w3.org/2000/svg" width="360" height="413" viewBox="0 0 360 413"><title>Keep the next column inside the board</title><desc>The destination must also be unblocked. You cannot block the start.</desc><rect width="360" height="413" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Keep the next column inside</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">the board</text><rect x="19" y="88" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="112" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">LEFT EXISTS WHEN</text><text x="31" y="135" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Y &gt; 1</text><text x="31" y="158" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">At column 1 there is no column 0.</text><rect x="19" y="195" width="322" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="219" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">RIGHT EXISTS WHEN</text><text x="31" y="242" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Y &lt; N</text><text x="31" y="265" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">At column N there is no column N +</text><text x="31" y="288" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1.</text><text x="19" y="346" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">The destination must also be</text><text x="19" y="368" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">unblocked. You cannot block the</text><text x="19" y="390" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">start.</text></svg>