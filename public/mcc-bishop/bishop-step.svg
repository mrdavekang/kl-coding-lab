<svg xmlns="http://www.w3.org/2000/svg" width="900" height="234" viewBox="0 0 900 234"><title>One diagonal step changes both numbers</title><desc>On a two-row board each move reaches an adjacent diagonal square.</desc><rect width="900" height="234" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">One diagonal step changes both numbers</text><rect x="32.0" y="60" width="411.0" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FROM (2, 3), LEFT</text><text x="44.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New row: 3 - 2 = 1</text><text x="44.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New column: 3 - 1 = 2</text><text x="44.0" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Destination: (1, 2)</text><rect x="457.0" y="60" width="411.0" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="469.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FROM (2, 3), RIGHT</text><text x="469.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New row: 3 - 2 = 1</text><text x="469.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">New column: 3 + 1 = 4</text><text x="469.0" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Destination: (1, 4)</text><text x="32" y="211" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">On a two-row board each move reaches an adjacent diagonal square.</text></svg>