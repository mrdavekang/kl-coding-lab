<svg xmlns="http://www.w3.org/2000/svg" width="900" height="211" viewBox="0 0 900 211"><title>One count line, then one line per case</title><desc>Read T once. Read a fresh N X Y line inside each loop turn.</desc><rect width="900" height="211" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">One count line, then one line per case</text><rect x="32.0" y="60" width="269.3333333333333" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FIRST LINE</text><text x="44.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">T = number of cases</text><text x="44.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Example: 3</text><rect x="315.3333333333333" y="60" width="269.3333333333333" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="327.3333333333333" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">EACH CASE LINE</text><text x="327.3333333333333" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">N X Y</text><text x="327.3333333333333" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">columns, row, column</text><rect x="598.6666666666666" y="60" width="269.3333333333333" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="610.6666666666666" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">READ ONE CASE</text><text x="610.6666666666666" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">input().split()</text><text x="610.6666666666666" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Convert its three items.</text><text x="32" y="188" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Read T once. Read a fresh N X Y line inside each loop turn.</text></svg>