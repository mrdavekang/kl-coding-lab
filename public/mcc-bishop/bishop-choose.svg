<svg xmlns="http://www.w3.org/2000/svg" width="900" height="234" viewBox="0 0 900 234"><title>Choose the smaller reachable count</title><desc>Changing X changes the row pattern; these column counts stay the same.</desc><rect width="900" height="234" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Choose the smaller reachable count</text><rect x="32.0" y="60" width="269.3333333333333" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">CALCULATE</text><text x="44.0" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">left = Y</text><text x="44.0" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">right = N - Y + 1</text><rect x="315.3333333333333" y="60" width="269.3333333333333" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="327.3333333333333" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">CHOOSE</text><text x="327.3333333333333" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Left smaller or equal: keep</text><text x="327.3333333333333" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">left.</text><text x="327.3333333333333" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Otherwise: keep right.</text><rect x="598.6666666666666" y="60" width="269.3333333333333" height="116" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="610.6666666666666" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">DISPLAY</text><text x="610.6666666666666" y="107" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">print(answer)</text><text x="610.6666666666666" y="130" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">min(left, right) is another</text><text x="610.6666666666666" y="153" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">way to choose.</text><text x="32" y="211" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">Changing X changes the row pattern; these column counts stay the same.</text></svg>