<svg xmlns="http://www.w3.org/2000/svg" width="360" height="561" viewBox="0 0 360 561"><title>Zero moves still leaves one square</title><desc>A zero-move route is allowed, so the answer is never zero.</desc><rect width="360" height="561" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Zero moves still leaves one</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">square</text><text x="150.5" y="125.05" fill="#536874" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">r=2</text><rect x="159.5" y="88" width="65" height="65" fill="#ffdfd2" stroke="#93acb9"/><text x="192.0" y="130.25" fill="#9b321e" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">×</text><text x="150.5" y="190.05" fill="#536874" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="end">r=1</text><rect x="159.5" y="153" width="65" height="65" fill="#205b76" stroke="#93acb9"/><text x="192.0" y="195.25" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">B</text><text x="192.0" y="238" fill="#536874" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">1</text><text x="180.0" y="258" fill="#536874" font-family="Arial, sans-serif" font-size="11" font-weight="400" text-anchor="middle">B = start     o = reachable     × = block</text><rect x="19" y="281" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="305" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ONE COLUMN</text><text x="31" y="328" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The bishop cannot move.</text><text x="31" y="351" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Block the only other square.</text><rect x="19" y="388" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="412" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">REACHABLE COUNT</text><text x="31" y="435" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1</text><text x="31" y="458" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The starting square counts.</text><text x="19" y="516" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">A zero-move route is allowed, so the</text><text x="19" y="538" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">answer is never zero.</text></svg>