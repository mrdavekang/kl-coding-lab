<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404"><title>Zero moves still leaves one square</title><desc>A zero-move route is allowed, so the answer is never zero.</desc><rect width="900" height="404" fill="white"/><text x="32" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start">Zero moves still leaves one square</text><text x="420.5" y="97.05" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end">r=2</text><rect x="429.5" y="60" width="65" height="65" fill="#ffdfd2" stroke="#93acb9"/><text x="462.0" y="102.25" fill="#9b321e" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">×</text><text x="420.5" y="162.05" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="end">r=1</text><rect x="429.5" y="125" width="65" height="65" fill="#205b76" stroke="#93acb9"/><text x="462.0" y="167.25" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">B</text><text x="462.0" y="210" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle">1</text><text x="450.0" y="230" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">B = start     o = reachable     × = block</text><rect x="32.0" y="253" width="411.0" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="44.0" y="277" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">ONE COLUMN</text><text x="44.0" y="300" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The bishop cannot move.</text><text x="44.0" y="323" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Block the only other square.</text><rect x="457.0" y="253" width="411.0" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="469.0" y="277" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">REACHABLE COUNT</text><text x="469.0" y="300" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">1</text><text x="469.0" y="323" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The starting square counts.</text><text x="32" y="381" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">A zero-move route is allowed, so the answer is never zero.</text></svg>