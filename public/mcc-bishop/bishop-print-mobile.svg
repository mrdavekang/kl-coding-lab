<svg xmlns="http://www.w3.org/2000/svg" width="360" height="345" viewBox="0 0 360 345"><title>An instruction becomes output</title><desc>print() displays a result. It does not read a new input.</desc><rect width="360" height="345" fill="white"/><text x="19" y="35" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">An instruction becomes</text><text x="19" y="63" fill="#173949" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">output</text><rect x="19" y="88" width="322" height="70" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="112" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">EDITOR</text><text x="31" y="135" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">print(&quot;BISHOP&quot;)</text><rect x="19" y="172" width="322" height="93" rx="5" fill="#f0f5f8" stroke="#c0d2dc"/><text x="31" y="196" fill="#205b76" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">SHELL</text><text x="31" y="219" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">BISHOP</text><text x="31" y="242" fill="#173949" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The quotes stay in the code.</text><text x="19" y="300" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">print() displays a result. It does</text><text x="19" y="322" fill="#536874" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">not read a new input.</text></svg>