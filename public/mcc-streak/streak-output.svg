<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><title>Output the endpoints</title><desc>The required answer is the start and end, rather than the length or Python indices.</desc><rect width="900" height="270" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Output the endpoints</text><rect x="32.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">INPUT IDEA</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The chosen run is rounds</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">10, 11, 12.</text><rect x="316.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="330.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">ANSWER TEXT</text><text x="330.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">10 12</text><text x="330.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Just two round numbers, on</text><text x="330.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">one line.</text><rect x="600.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="614.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PYTHON OUTPUT</text><text x="614.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">print(bestStart, bestEnd)</text><text x="32" y="239" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The required answer is the start and end, rather than the length or Python indices.</text></svg>