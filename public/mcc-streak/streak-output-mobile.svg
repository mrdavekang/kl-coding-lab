<svg xmlns="http://www.w3.org/2000/svg" width="360" height="622" viewBox="0 0 360 622"><title>Output the endpoints</title><desc>The required answer is the start and end, rather than the length or Python indices.</desc><rect width="360" height="622" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Output the endpoints</text><rect x="20" y="57" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">INPUT IDEA</text><text x="34" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The chosen run is rounds 10, 11,</text><text x="34" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">12.</text><rect x="20" y="213" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="240" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">ANSWER TEXT</text><text x="34" y="270" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">10 12</text><text x="34" y="294" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Just two round numbers, on one</text><text x="34" y="318" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">line.</text><rect x="20" y="369" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="396" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PYTHON OUTPUT</text><text x="34" y="426" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">print(bestStart, bestEnd)</text><text x="20" y="545" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The required answer is the start</text><text x="20" y="568" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">and end, rather than the length or</text><text x="20" y="591" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Python indices.</text></svg>