<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><title>Read two lines, keep their order</title><desc>split() separates the spaced results. It does not sort or convert them.</desc><rect width="900" height="270" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Read two lines, keep their order</text><rect x="32.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">INPUT</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">4</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">1 0 1 1</text><rect x="316.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="330.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PYTHON</text><text x="330.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">n = int(input())</text><text x="330.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">results = input().split()</text><rect x="600.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="614.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">REMEMBER</text><text x="614.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">n is the number 4.</text><text x="614.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">results contains &quot;1&quot;, &quot;0&quot;,</text><text x="614.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">&quot;1&quot;, &quot;1&quot;.</text><text x="32" y="239" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">split() separates the spaced results. It does not sort or convert them.</text></svg>