<svg xmlns="http://www.w3.org/2000/svg" width="900" height="556" viewBox="0 0 900 556"><title>Current means consecutive wins</title><desc>Count next-door wins. The total number of wins would be 5, not a streak.</desc><rect width="900" height="556" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Current means consecutive wins</text><text x="171.33333333333334" y="80" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Round</text><text x="450.0" y="80" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Result</text><text x="728.6666666666667" y="80" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Current</text><rect x="32.0" y="95" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="171.33333333333334" y="123" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="310.6666666666667" y="95" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="450.0" y="123" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="589.3333333333334" y="95" width="278.6666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="728.6666666666667" y="123" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="32.0" y="137" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="171.33333333333334" y="165" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">2</text><rect x="310.6666666666667" y="137" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="450.0" y="165" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="589.3333333333334" y="137" width="278.6666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="728.6666666666667" y="165" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">2</text><rect x="32.0" y="179" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="171.33333333333334" y="207" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">3</text><rect x="310.6666666666667" y="179" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="450.0" y="207" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">0</text><rect x="589.3333333333334" y="179" width="278.6666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="728.6666666666667" y="207" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">0</text><rect x="32.0" y="221" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="171.33333333333334" y="249" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">4</text><rect x="310.6666666666667" y="221" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="450.0" y="249" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="589.3333333333334" y="221" width="278.6666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="728.6666666666667" y="249" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="32.0" y="263" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="171.33333333333334" y="291" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">5</text><rect x="310.6666666666667" y="263" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="450.0" y="291" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="589.3333333333334" y="263" width="278.6666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="728.6666666666667" y="291" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">2</text><rect x="32.0" y="305" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="171.33333333333334" y="333" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">6</text><rect x="310.6666666666667" y="305" width="278.6666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="450.0" y="333" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="589.3333333333334" y="305" width="278.6666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="728.6666666666667" y="333" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">3</text><rect x="32.0" y="367" width="410.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="394" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">BEFORE THE ROUNDS</text><text x="46.0" y="424" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">current = 0</text><text x="46.0" y="448" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">No wins have been counted yet.</text><rect x="458.0" y="367" width="410.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="472.0" y="394" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">AT THE LOSS</text><text x="472.0" y="424" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Round 3 resets current to 0.</text><text x="472.0" y="448" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Round 4 begins again at 1.</text><text x="32" y="525" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Count next-door wins. The total number of wins would be 5, not a streak.</text></svg>