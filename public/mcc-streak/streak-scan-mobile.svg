<svg xmlns="http://www.w3.org/2000/svg" width="360" height="622" viewBox="0 0 360 622"><title>One visit to each round</title><desc>Keep the loop in time order. The record check runs after either branch.</desc><rect width="360" height="622" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">One visit to each round</text><rect x="20" y="57" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">1. READ THIS RESULT</text><text x="34" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A win: increase current.</text><text x="34" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A loss: reset current.</text><rect x="20" y="213" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="240" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">2. COMPARE WITH BEST</text><text x="34" y="270" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">If current is at least</text><text x="34" y="294" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">bestLength and is positive,</text><text x="34" y="318" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">update the record.</text><rect x="20" y="369" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="396" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">3. SAVE THE ENDPOINTS</text><text x="34" y="426" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">end = index + 1</text><text x="34" y="450" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">start = end - current + 1</text><text x="20" y="545" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Keep the loop in time order. The</text><text x="20" y="568" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">record check runs after either</text><text x="20" y="591" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">branch.</text></svg>