<svg xmlns="http://www.w3.org/2000/svg" width="360" height="495" viewBox="0 0 360 495"><title>Same length? Take the later start</title><desc>10 is greater than 5. With a left-to-right scan, &gt;= replaces an equal record.</desc><rect width="360" height="495" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Same length? Take the</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">later start</text><rect x="20" y="86" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">EARLIER RUN</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Rounds 5, 6, 7</text><text x="34" y="167" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Length 3</text><text x="34" y="191" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Start 5</text><rect x="20" y="242" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="269" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">LATER RUN: CHOOSE THIS</text><text x="34" y="299" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Rounds 10, 11, 12</text><text x="34" y="323" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Length 3</text><text x="34" y="347" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Start 10</text><text x="20" y="418" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">10 is greater than 5. With a left-</text><text x="20" y="441" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">to-right scan, &gt;= replaces an equal</text><text x="20" y="464" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">record.</text></svg>