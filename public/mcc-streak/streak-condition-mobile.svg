<svg xmlns="http://www.w3.org/2000/svg" width="360" height="447" viewBox="0 0 360 447"><title>Choose the win or loss branch</title><desc>Indent each branch. A loss breaks the streak; a later win starts again.</desc><rect width="360" height="447" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Choose the win or loss</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">branch</text><rect x="20" y="86" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">IF: result == &quot;1&quot;</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">This round is a WIN.</text><text x="34" y="167" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">current = current + 1</text><rect x="20" y="218" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="245" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">ELSE: result is &quot;0&quot;</text><text x="34" y="275" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">This round is a LOSS.</text><text x="34" y="299" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">current = 0</text><text x="20" y="370" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Indent each branch. A loss breaks</text><text x="20" y="393" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">the streak; a later win starts</text><text x="20" y="416" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">again.</text></svg>