<svg xmlns="http://www.w3.org/2000/svg" width="360" height="757" viewBox="0 0 360 757"><title>Current means consecutive wins</title><desc>Count next-door wins. The total number of wins would be 5, not a streak.</desc><rect width="360" height="757" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Current means consecutive</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">wins</text><text x="73.33333333333334" y="109" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Round</text><text x="180.0" y="109" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Result</text><text x="286.6666666666667" y="109" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Current</text><rect x="20.0" y="124" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="152" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="126.66666666666667" y="124" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="152" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="233.33333333333334" y="124" width="106.66666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="286.6666666666667" y="152" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="20.0" y="166" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="194" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">2</text><rect x="126.66666666666667" y="166" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="194" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="233.33333333333334" y="166" width="106.66666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="286.6666666666667" y="194" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">2</text><rect x="20.0" y="208" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="236" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">3</text><rect x="126.66666666666667" y="208" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="236" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">0</text><rect x="233.33333333333334" y="208" width="106.66666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="286.6666666666667" y="236" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">0</text><rect x="20.0" y="250" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="278" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">4</text><rect x="126.66666666666667" y="250" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="278" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="233.33333333333334" y="250" width="106.66666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="286.6666666666667" y="278" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="20.0" y="292" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="320" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">5</text><rect x="126.66666666666667" y="292" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="320" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="233.33333333333334" y="292" width="106.66666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="286.6666666666667" y="320" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">2</text><rect x="20.0" y="334" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="362" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">6</text><rect x="126.66666666666667" y="334" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="362" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="233.33333333333334" y="334" width="106.66666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="286.6666666666667" y="362" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">3</text><rect x="20" y="396" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="423" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">BEFORE THE ROUNDS</text><text x="34" y="453" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">current = 0</text><text x="34" y="477" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">No wins have been counted yet.</text><rect x="20" y="528" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="555" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">AT THE LOSS</text><text x="34" y="585" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Round 3 resets current to 0.</text><text x="34" y="609" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Round 4 begins again at 1.</text><text x="20" y="680" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Count next-door wins. The total</text><text x="20" y="703" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">number of wins would be 5, not a</text><text x="20" y="726" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">streak.</text></svg>