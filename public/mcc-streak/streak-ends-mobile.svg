<svg xmlns="http://www.w3.org/2000/svg" width="360" height="527" viewBox="0 0 360 527"><title>Count both endpoints</title><desc>Length = end - start + 1. Start = end - length + 1.</desc><rect width="360" height="527" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Count both endpoints</text><rect x="20" y="57" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">THE ROUNDS</text><text x="34" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">5, 6, 7</text><text x="34" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">There are THREE rounds.</text><rect x="20" y="189" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="216" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">FIND THE LENGTH</text><text x="34" y="246" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">7 - 5 + 1 = 3</text><rect x="20" y="321" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="348" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">FIND THE START</text><text x="34" y="378" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">7 - 3 + 1 = 5</text><text x="20" y="473" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Length = end - start + 1. Start =</text><text x="20" y="496" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">end - length + 1.</text></svg>