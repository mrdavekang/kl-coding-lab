<svg xmlns="http://www.w3.org/2000/svg" width="900" height="294" viewBox="0 0 900 294"><title>One visit to each round</title><desc>Keep the loop in time order. The record check runs after either branch.</desc><rect width="900" height="294" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">One visit to each round</text><rect x="32.0" y="57" width="268.0" height="166" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">1. READ THIS RESULT</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A win: increase current.</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">A loss: reset current.</text><rect x="316.0" y="57" width="268.0" height="166" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="330.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">2. COMPARE WITH BEST</text><text x="330.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">If current is at least</text><text x="330.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">bestLength and is</text><text x="330.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">positive, update the</text><text x="330.0" y="186" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">record.</text><rect x="600.0" y="57" width="268.0" height="166" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="614.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">3. SAVE THE ENDPOINTS</text><text x="614.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">end = index + 1</text><text x="614.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">start = end - current + 1</text><text x="32" y="263" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Keep the loop in time order. The record check runs after either branch.</text></svg>