<svg xmlns="http://www.w3.org/2000/svg" width="900" height="246" viewBox="0 0 900 246"><title>Choose the win or loss branch</title><desc>Indent each branch. A loss breaks the streak; a later win starts again.</desc><rect width="900" height="246" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Choose the win or loss branch</text><rect x="32.0" y="57" width="410.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">IF: result == &quot;1&quot;</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">This round is a WIN.</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">current = current + 1</text><rect x="458.0" y="57" width="410.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="472.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">ELSE: result is &quot;0&quot;</text><text x="472.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">This round is a LOSS.</text><text x="472.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">current = 0</text><text x="32" y="215" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Indent each branch. A loss breaks the streak; a later win starts again.</text></svg>