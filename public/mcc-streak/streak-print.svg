<svg xmlns="http://www.w3.org/2000/svg" width="900" height="246" viewBox="0 0 900 246"><title>An instruction becomes output</title><desc>Typing the instruction and displaying its result are different steps.</desc><rect width="900" height="246" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">An instruction becomes output</text><rect x="32.0" y="57" width="410.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PYTHON EDITOR</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">print(&quot;WIN&quot;)</text><rect x="458.0" y="57" width="410.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="472.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">SHELL</text><text x="472.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">WIN</text><text x="472.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The quotes stay in the code.</text><text x="32" y="215" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Typing the instruction and displaying its result are different steps.</text></svg>