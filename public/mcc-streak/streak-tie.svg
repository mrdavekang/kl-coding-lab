<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><title>Same length? Take the later start</title><desc>10 is greater than 5. With a left-to-right scan, &gt;= replaces an equal record.</desc><rect width="900" height="270" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Same length? Take the later start</text><rect x="32.0" y="57" width="410.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">EARLIER RUN</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Rounds 5, 6, 7</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Length 3</text><text x="46.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Start 5</text><rect x="458.0" y="57" width="410.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="472.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">LATER RUN: CHOOSE THIS</text><text x="472.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Rounds 10, 11, 12</text><text x="472.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Length 3</text><text x="472.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Start 10</text><text x="32" y="239" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">10 is greater than 5. With a left-to-right scan, &gt;= replaces an equal record.</text></svg>