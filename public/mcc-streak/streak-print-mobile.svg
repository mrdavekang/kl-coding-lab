<svg xmlns="http://www.w3.org/2000/svg" width="360" height="447" viewBox="0 0 360 447"><title>An instruction becomes output</title><desc>Typing the instruction and displaying its result are different steps.</desc><rect width="360" height="447" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">An instruction becomes</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">output</text><rect x="20" y="86" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PYTHON EDITOR</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">print(&quot;WIN&quot;)</text><rect x="20" y="218" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="245" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">SHELL</text><text x="34" y="275" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">WIN</text><text x="34" y="299" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The quotes stay in the code.</text><text x="20" y="370" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Typing the instruction and</text><text x="20" y="393" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">displaying its result are different</text><text x="20" y="416" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">steps.</text></svg>