<svg xmlns="http://www.w3.org/2000/svg" width="360" height="651" viewBox="0 0 360 651"><title>Read two lines, keep their order</title><desc>split() separates the spaced results. It does not sort or convert them.</desc><rect width="360" height="651" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Read two lines, keep their</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">order</text><rect x="20" y="86" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">INPUT</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">4</text><text x="34" y="167" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">1 0 1 1</text><rect x="20" y="242" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="269" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PYTHON</text><text x="34" y="299" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">n = int(input())</text><text x="34" y="323" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">results = input().split()</text><rect x="20" y="398" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="425" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">REMEMBER</text><text x="34" y="455" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">n is the number 4.</text><text x="34" y="479" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">results contains &quot;1&quot;, &quot;0&quot;, &quot;1&quot;,</text><text x="34" y="503" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">&quot;1&quot;.</text><text x="20" y="574" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">split() separates the spaced</text><text x="20" y="597" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">results. It does not sort or</text><text x="20" y="620" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">convert them.</text></svg>