chor="start">LOOK UP</text><text x="34" y="340" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">results[1] is &quot;1&quot;.</text><rect x="20" y="407" width="320" height="110" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="434" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">ROUND NUMBER</text><text x="34" y="464" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Index 1 + 1 gives round 2.</text><text x="20" y="551" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The stored result, its Python index</text><text x="20" y="574" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">and its round number are different.</text></svg>