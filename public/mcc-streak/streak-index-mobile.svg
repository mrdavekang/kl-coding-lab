<svg xmlns="http://www.w3.org/2000/svg" width="360" height="605" viewBox="0 0 360 605"><title>An index is a place label</title><desc>The stored result, its Python index and its round number are different.</desc><rect width="360" height="605" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">An index is a place label</text><text x="73.33333333333334" y="80" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Result</text><text x="180.0" y="80" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Index</text><text x="286.6666666666667" y="80" fill="#536874" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="middle">Round</text><rect x="20.0" y="95" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="123" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">0</text><rect x="126.66666666666667" y="95" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="123" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">0</text><rect x="233.33333333333334" y="95" width="106.66666666666667" height="42" fill="#fff0b6" stroke="#b6c9d4"/><text x="286.6666666666667" y="123" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="20.0" y="137" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="73.33333333333334" y="165" fill="#205b76" font-family="Consolas, monospace" font-size="19" font-weight="650" text-anchor="middle">1</text><rect x="126.66666666666667" y="137" width="106.66666666666667" height="42" fill="#eaf2fa" stroke="#b6c9d4"/><text x="180.0" y="165" fill="#205b76" font-family="Consolas, monospa