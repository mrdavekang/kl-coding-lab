<svg xmlns="http://www.w3.org/2000/svg" width="900" height="246" viewBox="0 0 900 246"><title>Input, processing, answer file</title><desc>A .py file contains instructions. An answer .txt file contains the result.</desc><rect width="900" height="246" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Input, processing, answer file</text><rect x="32.0" y="57" width="268.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">INPUT FILE</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The given case: its size</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">and values.</text><rect x="316.0" y="57" width="268.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="330.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PROCESS</text><text x="330.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Work by hand or use Python</text><text x="330.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">to apply the rules.</text><rect x="600.0" y="57" width="268.0" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="614.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">OUTPUT FILE</text><text x="614.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Only the required result.</text><text x="614.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">For example: 2 3</text><text x="32" y="215" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">A .py file contains instructions. An answer .txt file contains the result.</text></svg>