<svg xmlns="http://www.w3.org/2000/svg" width="900" height="294" viewBox="0 0 900 294"><title>Two questions, two answer formats</title><desc>Answer text contains no prompts, Python instructions, quotation marks or labels.</desc><rect width="900" height="294" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Two questions, two answer formats</text><rect x="32.0" y="57" width="410.0" height="166" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">BINARY SORTING</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">2</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">2 6</text><text x="46.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">4 5</text><text x="46.0" y="186" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Count first, then that many swap pairs.</text><rect x="458.0" y="57" width="410.0" height="166" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="472.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">WINNING STREAK</text><text x="472.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">10 12</text><text x="472.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">First and last round, on one line.</text><text x="32" y="263" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Answer text contains no prompts, Python instructions, quotation marks or labels.</text></svg>