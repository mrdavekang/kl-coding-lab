<svg xmlns="http://www.w3.org/2000/svg" width="360" height="591" viewBox="0 0 360 591"><title>Two questions, two answer formats</title><desc>Answer text contains no prompts, Python instructions, quotation marks or labels.</desc><rect width="360" height="591" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Two questions, two answer</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">formats</text><rect x="20" y="86" width="320" height="190" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">BINARY SORTING</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">2</text><text x="34" y="167" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">2 6</text><text x="34" y="191" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">4 5</text><text x="34" y="215" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Count first, then that many swap</text><text x="34" y="239" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">pairs.</text><rect x="20" y="290" width="320" height="190" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="317" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">WINNING STREAK</text><text x="34" y="347" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">10 12</text><text x="34" y="371" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">First and last round, on one</text><text x="34" y="395" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">line.</text><text x="20" y="514" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Answer text contains no prompts,</text><text x="20" y="537" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Python instructions, quotation</text><text x="20" y="560" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">marks or labels.</text></svg>