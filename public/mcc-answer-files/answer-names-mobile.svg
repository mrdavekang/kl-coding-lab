<svg xmlns="http://www.w3.org/2000/svg" width="360" height="495" viewBox="0 0 360 495"><title>Match the file to its answer</title><desc>Keep the same case number. A different input needs its own answer.</desc><rect width="360" height="495" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Match the file to its</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">answer</text><rect x="20" y="86" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">SAMPLE INPUT</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">sample_in_01.txt</text><text x="34" y="167" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Your answer name:</text><text x="34" y="191" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">out_sample_01.txt</text><rect x="20" y="242" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="269" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">SCORED INPUT</text><text x="34" y="299" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">in_01.txt</text><text x="34" y="323" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Your answer name:</text><text x="34" y="347" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">out_01.txt</text><text x="20" y="418" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Keep the same case number. A</text><tex