<svg xmlns="http://www.w3.org/2000/svg" width="360" height="651" viewBox="0 0 360 651"><title>Work it out, check, download</title><desc>A successful Python run is different from a correct answer. Check the result.</desc><rect width="360" height="651" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Work it out, check,</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">download</text><rect x="20" y="86" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">1. MAKE THE ANSWER</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Act it out, calculate it, or run</text><text x="34" y="167" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">your Python.</text><rect x="20" y="242" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="269" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">2. CHECK THE ANSWER</text><text x="34" y="299" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Check this text against its</text><text x="34" y="323" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">matching input. Fix errors and</text><text x="34" y="347" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">retry.</text><rect x="20" y="398" width="320" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="425" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">3. SAVE THE FILE</text><text x="34" y="455" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Download the matching out_...txt</text><text x="34" y="479" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">file. Keep your own copy.</text><text x="20" y="574" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">A successful Python run is</text><text x="20" y="597" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">different from a correct answer.</text><text x="20" y="620" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Check the result.</text></svg>