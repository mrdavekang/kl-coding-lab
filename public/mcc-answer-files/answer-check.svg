<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270"><title>Work it out, check, download</title><desc>A successful Python run is different from a correct answer. Check the result.</desc><rect width="900" height="270" fill="white"/><text x="32" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="27" font-weight="650" text-anchor="start">Work it out, check, download</text><rect x="32.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="46.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">1. MAKE THE ANSWER</text><text x="46.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Act it out, calculate it,</text><text x="46.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">or run your Python.</text><rect x="316.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="330.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">2. CHECK THE ANSWER</text><text x="330.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Check this text against</text><text x="330.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">its matching input. Fix</text><text x="330.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">errors and retry.</text><rect x="600.0" y="57" width="268.0" height="142" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="614.0" y="84" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">3. SAVE THE FILE</text><text x="614.0" y="114" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Download the matching</text><text x="614.0" y="138" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">out_...txt file. Keep your</text><text x="614.0" y="162" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">own copy.</text><text x="32" y="239" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">A successful Python run is different from a correct answer. Check the result.</text></svg>