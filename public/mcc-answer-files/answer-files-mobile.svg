<svg xmlns="http://www.w3.org/2000/svg" width="360" height="579" viewBox="0 0 360 579"><title>Input, processing, answer file</title><desc>A .py file contains instructions. An answer .txt file contains the result.</desc><rect width="360" height="579" fill="white"/><text x="20" y="36" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">Input, processing, answer</text><text x="20" y="65" fill="#173949" font-family="Arial, sans-serif" font-size="23" font-weight="650" text-anchor="start">file</text><rect x="20" y="86" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="113" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">INPUT FILE</text><text x="34" y="143" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">The given case: its size and</text><text x="34" y="167" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">values.</text><rect x="20" y="218" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="245" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">PROCESS</text><text x="34" y="275" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Work by hand or use Python to</text><text x="34" y="299" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">apply the rules.</text><rect x="20" y="350" width="320" height="118" rx="6" fill="#f0f5f8" stroke="#bfd1dc"/><text x="34" y="377" fill="#205b76" font-family="Arial, sans-serif" font-size="15" font-weight="650" text-anchor="start">OUTPUT FILE</text><text x="34" y="407" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Only the required result.</text><text x="34" y="431" fill="#173949" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">For example: 2 3</text><text x="20" y="502" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">A .py file contains instructions.</text><text x="20" y="525" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">An answer .txt file contains the</text><text x="20" y="548" fill="#536874" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">result.</text></svg>